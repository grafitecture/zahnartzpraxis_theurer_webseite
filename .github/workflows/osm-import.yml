name: OSM-Daten fuer die Anfahrtskarte (einmalig)

on:
  push:
    branches: [osm-import]
    paths:
      - ".github/workflows/osm-import.yml"
      - "scripts/osm_import.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Geocoding und Overpass-Abfrage
        run: python3 scripts/osm_import.py 2>&1 | tee osm-import.log
      - name: Ergebnis committen
        run: |
          mkdir -p osm && mv osm-import.log osm/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osm
          git commit -m "OSM-Daten fuer die Anfahrtskarte" || exit 0
          git push
