name: Legacy-Import (einmalig)

on:
  push:
    branches: [legacy-import]
    paths:
      - ".github/workflows/legacy-import.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Alte Website importieren
        run: bash scripts/legacy-import.sh 2>&1 | tee legacy-import.log
      - name: Ergebnis committen
        run: |
          mkdir -p legacy && mv legacy-import.log legacy/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy
          git commit -m "Legacy-Import: Inhalte und Medien der alten Website" || exit 0
          git push
